# Checks game submissions on every pull request and tells the contributor exactly what to fix.
name: Validate games

on:
  pull_request:
    paths:
      - "games/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The validator has no dependencies, so no npm install is needed.
      - name: Validate every game.json
        run: node scripts/validate-games.js

      - name: Flag changes outside games/<id>/game.json
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [ -n "$BASE_SHA" ] || exit 0
          other=$(git diff --name-only "$BASE_SHA" HEAD | grep -vE '^games/[^/]+/game\.json$' || true)
          if [ -n "$other" ]; then
            echo "::warning::This PR changes files other than games/<id>/game.json. Game submissions should only add a game.json; screenshots and index files are generated after merge."
            echo "$other"
          fi
